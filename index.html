<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>體重紀錄｜170cm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Chart.js CDN：用來畫體重變化折線圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --card-bg: #ffffff;
      --primary: #3056d3;
      --primary-soft: #e5ebff;
      --accent: #f97373;
      --text-main: #1f2933;
      --text-sub: #6b7280;
      --border: #e2e8f0;
      --radius-lg: 16px;
      --radius-sm: 6px;
      --shadow-soft: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
        "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top, #eef2ff 0, #f9fafb 40%, #f5f7fb 100%);
      color: var(--text-main);
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    header {
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 26px;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 span.emoji {
      font-size: 26px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      color: var(--text-sub);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.8fr);
      gap: 16px;
      margin-bottom: 18px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 16px 18px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title span.icon {
      font-size: 18px;
    }

    /* 基本資訊區 */
    .profile-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      font-size: 13px;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip strong {
      font-weight: 600;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 600px) {
      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .stat-item {
      background: #f9fafb;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      border: 1px solid var(--border);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 600;
    }

    .stat-tag {
      font-size: 11px;
      color: var(--primary);
      margin-left: 4px;
    }

    .stat-change-positive {
      color: #16a34a;
      font-size: 12px;
      margin-top: 2px;
    }

    .stat-change-negative {
      color: var(--accent);
      font-size: 12px;
      margin-top: 2px;
    }

    /* 表格 */
    .table-wrapper {
      max-height: 320px;
      overflow: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #f9fafb;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 260px;
    }

    thead {
      position: sticky;
      top: 0;
      background: #e5ebff;
      z-index: 1;
    }

    th,
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      font-weight: 600;
      color: var(--text-sub);
    }

    tr:nth-child(even) td {
      background: #f9fafb;
    }

    tr.highlight td {
      background: #fef3c7;
      font-weight: 600;
    }

    /* 圖表卡片 */
    #weightChart {
    width: 100%;
    max-height: 260px;
    min-height: 190px;
    }

    @media (max-width: 768px) {
    #weightChart {
        max-height: 230px;
        min-height: 170px;
    }
    }

    @media (max-width: 480px) {
    #weightChart {
        max-height: 210px;
        min-height: 160px;
    }
    }


    .chart-legend {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 4px;
      border: 1px solid rgba(15, 23, 42, 0.3);
      background: #ffffff; /* 真實顏色由 JS 動態塞 */
    }

    footer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--text-sub);
      text-align: center;
    }
    /* ========= 手機 / 平板 RWD ========= */

/* 平板以下（約 iPad / 一般手機橫向） */
@media (max-width: 768px) {
  body {
    background: #f5f7fb; /* 手機就不要太強的漸層，乾淨一點 */

}

/* 小手機（iPhone SE / 8 size） */
@media (max-width: 480px) {

  }

  }

    padding: 12px 10px;

    flex-direction: column;
    align-items: stretch;
  }

    width: 100%;
    justify-content: space-between;
  }

  .stat-grid {
    grid-template-columns: 1fr; /* 三個小卡片改成一列一個，往下排 */
    gap: 6px;
  }

  .stat-item {
    padding: 6px 8px;
  }

  footer {
    font-size: 10px;
  }

  /* 表格在手機上更貼邊一點 */
  .table-wrapper {
    border-radius: 10px;
  }

  table {
    font-size: 12px;
  }

  th,
  td {
    padding: 6px 6px;
  }
}
.chart-filter {
  display: flex;
  gap: 8px;
  margin: 4px 0 12px;
  flex-wrap: wrap;
}

.chart-filter-btn {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text-sub);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.chart-filter-btn:hover {

  border-color: var(--primary-soft);
}

.chart-filter-btn.is-active {

  color: #fff;
  border-color: var(--primary);
}

    <footer>

    // ====== 資料區 ======
const heightCm = 170;
const goalWeight = 60;

const records = [

// ====== 小工具 function ======
function formatDate(record) {
  return `${record.month}/${record.day}`;
}

function calcBmi(weightKg, heightCm) {
  const h = heightCm / 100;
  return weightKg / (h * h);
}

function bmiCategory(bmi) {
  if (bmi < 18.5) return '過輕';
  if (bmi < 24) return '正常';
  if (bmi < 27) return '過重';
  if (bmi < 30) return '輕度肥胖';
  if (bmi < 35) return '中度肥胖';
  return '重度肥胖';
}

function getWeightDiffText(currentWeight, previousWeight) {
  if (previousWeight === null || previousWeight === undefined) {
    return '第一筆紀錄';
  }

  const diff = currentWeight - previousWeight;

  if (diff < 0) {
    return `比上一筆少 ${Math.abs(diff).toFixed(2)} kg`;
  }

  if (diff > 0) {
    return `比上一筆多 ${diff.toFixed(2)} kg`;
  }

  return '跟上一筆一樣';
}

// ====== DOM ======
const heightText = document.getElementById('heightText');
const latestWeightText = document.getElementById('latestWeightText');
const bmiValueEl = document.getElementById('bmiValue');
const bmiTagEl = document.getElementById('bmiTag');
const diffFromStartEl = document.getElementById('diffFromStart');
const diffFromStartTextEl = document.getElementById('diffFromStartText');
const recordCountEl = document.getElementById('recordCount');
const lastUpdateTextEl = document.getElementById('lastUpdateText');
const tbody = document.getElementById('recordTbody');

// ====== 排序：支援 11、12、1 跨年 ======
const startMonth = records[0].month;

records.sort((a, b) => {
  const aMonthIndex = a.month + (a.month < startMonth ? 12 : 0);
  const bMonthIndex = b.month + (b.month < startMonth ? 12 : 0);

  if (aMonthIndex === bMonthIndex) {
    return a.day - b.day;
  }

  return aMonthIndex - bMonthIndex;
});

// ====== 基本資料 ======
// ====== DOM ======
const chartFilterBtns = document.querySelectorAll('.chart-filter-btn');

// ====== 日期處理：補年份，讓近 2 個月 / 近半年可以判斷 ======
function getRecordDate(record) {
  const startYear = 2025;
  const year = record.month < startMonth ? startYear + 1 : startYear;
  return new Date(year, record.month - 1, record.day);
}

function getRangeRecords(range) {
  if (range === 'all') return records;

  const latestDate = getRecordDate(records[records.length - 1]);
  const startDate = new Date(latestDate);

  if (range === '2m') {
    startDate.setMonth(startDate.getMonth() - 2);
  }

  if (range === '6m') {
    startDate.setMonth(startDate.getMonth() - 6);
  }

  return records.filter((record) => getRecordDate(record) >= startDate);
}

function updateSummary(currentRecords) {
  const firstRecord = currentRecords[0];
  const latestRecord = currentRecords[currentRecords.length - 1];
  const latestBmi = calcBmi(latestRecord.weight, heightCm);
  const diff = latestRecord.weight - firstRecord.weight;

  heightText.textContent = `${heightCm} cm`;
  latestWeightText.textContent = `${latestRecord.weight.toFixed(2)} kg`;

  bmiValueEl.textContent = latestBmi.toFixed(2);
  bmiTagEl.textContent = `(${bmiCategory(latestBmi)})`;

  const diffAbs = Math.abs(diff).toFixed(2);

  if (diff < 0) {
    diffFromStartEl.textContent = `-${diffAbs} kg`;
    diffFromStartTextEl.className = 'stat-change-positive';
    diffFromStartTextEl.textContent = 'YAP✨';
  } else if (diff > 0) {
    diffFromStartEl.textContent = `+${diffAbs} kg`;
    diffFromStartTextEl.className = 'stat-change-negative';
    diffFromStartTextEl.textContent = '這段期間有微微上升，可以再觀察一下～';
  } else {
    diffFromStartEl.textContent = '0 kg';
    diffFromStartTextEl.className = 'stat-change-positive';
    diffFromStartTextEl.textContent = '這段期間維持不變。';
  }

  recordCountEl.textContent = `${currentRecords.length} 筆`;
  lastUpdateTextEl.textContent = `${latestRecord.month} 月 ${latestRecord.day} 日`;
}

function renderTable(currentRecords) {
  tbody.innerHTML = '';

  const latestRecord = currentRecords[currentRecords.length - 1];

  currentRecords.forEach((record, index) => {
    const tr = document.createElement('tr');

    if (record === latestRecord) {
      tr.classList.add('highlight');
    }

    const previousRecord = currentRecords[index - 1];
    const bmi = calcBmi(record.weight, heightCm);

    const tdDate = document.createElement('td');
    tdDate.textContent = formatDate(record);

    const tdWeight = document.createElement('td');
    tdWeight.textContent = record.weight.toFixed(2);

    const tdBmi = document.createElement('td');
    tdBmi.textContent = bmi.toFixed(2);

    tr.title = getWeightDiffText(
      record.weight,
      previousRecord ? previousRecord.weight : null
    );

    tr.appendChild(tdDate);
    tr.appendChild(tdWeight);
    tr.appendChild(tdBmi);

    tbody.appendChild(tr);
  });
}

// ====== 目標線 plugin ======
const goalLinePlugin = {
  id: 'goalLinePlugin',
  afterDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    const y = scales.y.getPixelForValue(goalWeight);

    if (y < chartArea.top || y > chartArea.bottom) return;

    ctx.save();

    ctx.beginPath();
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#f97373';
    ctx.moveTo(chartArea.left, y);
    ctx.lineTo(chartArea.right, y);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.fillStyle = '#f97373';
    ctx.font = '12px sans-serif';
    ctx.fillText(`${goalWeight}kg 目標`, chartArea.left + 8, y - 8);

    ctx.restore();
  }
};

// ====== 畫圖 ======
const ctx = document.getElementById('weightChart').getContext('2d');

let currentRecords = getRangeRecords('2m');

const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: currentRecords.map(formatDate),
    datasets: [
      {
        label: '體重 (kg)',
        data: currentRecords.map((record) => record.weight),
        tension: 0.3,
        fill: false,
        borderWidth: 2,
        pointRadius: 3,
        pointHoverRadius: 5,
        borderColor: '#3056d3',
        pointBackgroundColor: '#ffffff',
        pointBorderColor: '#3056d3'
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: {
      mode: 'index',
      intersect: false
    },
    scales: {
      x: {
        ticks: {
          font: {
            size: 11
          }
        }
      },
      y: {
        suggestedMin: goalWeight - 2,
        title: {
          display: true,
          text: 'kg'
        },
        ticks: {
          font: {
            size: 11
          }
        }
      }
    },
    plugins: {
      legend: {
        display: false
      },
      tooltip: {
        callbacks: {
          label(context) {
            const index = context.dataIndex;
            const currentRecord = currentRecords[index];
            const previousRecord = currentRecords[index - 1];

            const weightText = `體重：${currentRecord.weight.toFixed(2)} kg`;
            const diffText = getWeightDiffText(
              currentRecord.weight,
              previousRecord ? previousRecord.weight : null
            );

            return [weightText, diffText];
          },
          afterLabel(context) {
            const currentWeight = currentRecords[context.dataIndex].weight;
            const distance = currentWeight - goalWeight;

            if (distance > 0) {
              return `距離 ${goalWeight}kg 還差 ${distance.toFixed(2)} kg`;
            }

            if (distance < 0) {
              return `已低於目標 ${Math.abs(distance).toFixed(2)} kg`;
            }

            return `剛好達標！`;
          }
        }
      }
    }
  },
  plugins: [goalLinePlugin]
});

function updateChart(range) {
  currentRecords = getRangeRecords(range);

  chart.data.labels = currentRecords.map(formatDate);
  chart.data.datasets[0].data = currentRecords.map((record) => record.weight);
  chart.update();

  updateSummary(currentRecords);
  renderTable(currentRecords);
}

// ====== 篩選按鈕 ======
chartFilterBtns.forEach((btn) => {
  btn.addEventListener('click', () => {
    chartFilterBtns.forEach((item) => item.classList.remove('is-active'));
    btn.classList.add('is-active');

    updateChart(btn.dataset.range);
  });
});

// ====== 初始畫面：近 2 個月 ======
updateChart('2m');

// ====== legend 小圓點顏色 ======
const lineColorDot = document.getElementById('lineColorDot');

if (lineColorDot) {
  lineColorDot.style.background = '#3056d3';
}
  </script>
</body>
</html>
